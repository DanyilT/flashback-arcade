<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Square corners on purpose: the tile that shows this already clips the
       art to its own lopsided radius, so rounding here only fought that. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.5" stop-color="#ff9b21"/>
      <stop offset="1" stop-color="#e2680a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#g)"/>
  <rect x="7" y="7" width="186" height="186" fill="none" stroke="#ffe9c2" stroke-width="3" opacity="0.75"/>
  <circle cx="100" cy="86" r="40" fill="none" stroke="#7a3b00" stroke-width="12" opacity="0.55"/>
  <text x="100" y="103" fill="#7a3b00" font-family="'Trebuchet MS',Arial,sans-serif" font-size="54" font-weight="bold" text-anchor="middle" opacity="0.75">?</text>
  <text x="100" y="158" fill="#7a3b00" font-family="'Trebuchet MS',Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle" opacity="0.8">NO IMAGE</text>
</svg>
